gradle.projectsEvaluated {
    def appProject = gradle.rootProject.findProject(':app')
    appProject.tasks.register('dumpDebugCompileClasspathForCodex') {
        doLast {
            appProject.configurations.getByName('debugCompileClasspath').files
                .sort { it.absolutePath }
                .each { println("CLASSPATH_ENTRY=" + it.absolutePath) }
        }
    }
}
