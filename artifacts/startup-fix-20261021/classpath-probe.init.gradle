gradle.projectsEvaluated {
    def appProject = gradle.rootProject.project(':app')
    def compileTask = appProject.tasks.named('compileDebugJavaWithJavac').get()
    def support = new File(gradle.rootProject.projectDir, 'artifacts/startup-fix-20261021/compiled-app-classpath.jar')
    def workRuntime = new File(gradle.rootProject.projectDir, 'artifacts/startup-fix-20261021/work-runtime-2.9.0-original-classes.jar')
    compileTask.setClasspath(appProject.files(support, workRuntime, compileTask.classpath))
    println 'JAVAC_SUPPORT_ORDER=' + compileTask.classpath.files.take(6).join('|')
    println 'JAVAC_SUPPORT_PRESENT=' + compileTask.classpath.files.contains(support)
    println 'JAVAC_WORK_PRESENT=' + compileTask.classpath.files.contains(workRuntime)
}
